name: peaje_ia_movil
description: Aplicación móvil para el Sistema Inteligente de Control de Peaje (IAM-811) con Google Sign-In, Modo Caseta (2-5 fps) y Modo Consulta (Agente Conversacional Qwen).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_sign_in: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
